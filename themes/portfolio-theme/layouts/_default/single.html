{{ define "main" }}
<article class="page{{ if eq .File.BaseFileName "projects" }} projects{{ end }}">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ if .Params.subtitle }}
    <p class="page-subtitle">{{ .Params.subtitle }}</p>
    {{ end }}
  </header>
  
  {{ if eq .File.BaseFileName "about" }}
  <div class="portrait-frame-container-about">
    <div class="portrait-frame">
      <div class="portrait-frame-inner">
        <img src="/images/portrait.png" alt="Denver Hogan" class="portrait-image">
      </div>
    </div>
  </div>
  {{ end }}
  
  <div class="page-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
